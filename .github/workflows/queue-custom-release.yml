name: Queue Custom Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  create-release-tag:
    if: github.repository == 'qiaohs/qq-pet-copilot'
    runs-on: ubuntu-latest
    steps:
      - name: Create one-time release tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v0.7.1-custom.2
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; nothing to do."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$GITHUB_SHA"
