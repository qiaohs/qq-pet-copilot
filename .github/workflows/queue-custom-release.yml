name: Queue Custom Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  create-release-tag:
    if: github.repository == 'qiaohs/qq-pet-copilot'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch one-time release build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v0.7.1-custom.2
        run: |
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag="$RELEASE_TAG" \
            -f ref="$GITHUB_SHA"
